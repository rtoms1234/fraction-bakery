<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#FFF6FA"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%A7%81%3C/text%3E%3C/svg%3E"><link rel="apple-touch-icon" href="icon.png"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:system-ui,sans-serif;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Fraction Bakery</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: phone-first one-column app (max 540px), screens swapped in place, big tap targets, sticky top bar with coins */
:root{
  --bg:#FFF6FA; --surface:#FFFFFF; --surface2:#FFECF3; --ink:#3B2A4A; --ink2:#7D6B8F; --line:#F2D3E3; --cut:#D9B4CB;
  --berry:#FF5C9D; --berry-deep:#D93A7C; --grape:#7B61FF; --grape-deep:#5A42D6; --mint:#2FCB9A; --lemon:#FFD24D; --sky:#4CC3F0; --peach:#FF9F6E;
  --good:#2DBE86; --bad:#FF6B6B; --good-bg:#E3FBF1; --bad-bg:#FFE9E9; --hint-bg:#FFF5D6;
  --shadow:#F0C4D8; --shadow2:#E3B3CB;
  --display:'Fredoka',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1F1832; --surface:#2C2347; --surface2:#3A2E5C; --ink:#FFF3F9; --ink2:#C7B6DE; --line:#4A3C70; --cut:#6E5C96;
  --good-bg:#1F4A3A; --bad-bg:#4A2430; --hint-bg:#4A3E1F; --shadow:#171127; --shadow2:#120D20; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1F1832; --surface:#2C2347; --surface2:#3A2E5C; --ink:#FFF3F9; --ink2:#C7B6DE; --line:#4A3C70; --cut:#6E5C96;
  --good-bg:#1F4A3A; --bad-bg:#4A2430; --hint-bg:#4A3E1F; --shadow:#171127; --shadow2:#120D20; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:540px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:12px;padding-bottom:28px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:2rem}h2{font-size:1.5rem}h3{font-size:1.15rem}
.muted{color:var(--ink2)}
.small{font-size:.9rem}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px 4px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:1.1rem}
.brand .mascot{font-size:1.6rem}
.pills{display:flex;gap:6px}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 10px;font-family:var(--display);font-weight:600;font-size:.95rem;font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--display);font-weight:600;font-size:1.15rem;
  padding:14px 22px;border-radius:18px;background:var(--surface);color:var(--ink);box-shadow:0 5px 0 var(--shadow);border:2px solid var(--line);
  transition:transform .08s,box-shadow .08s;user-select:none;min-height:54px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shadow)}
.btn.primary{background:var(--berry);color:#fff;border-color:var(--berry);box-shadow:0 5px 0 var(--berry-deep)}
.btn.primary:active{box-shadow:0 1px 0 var(--berry-deep)}
.btn.grape{background:var(--grape);color:#fff;border-color:var(--grape);box-shadow:0 5px 0 var(--grape-deep)}
.btn.grape:active{box-shadow:0 1px 0 var(--grape-deep)}
.btn.mint{background:var(--mint);color:#17352B;border-color:var(--mint);box-shadow:0 5px 0 #1E9C74}
.btn.big{width:100%;font-size:1.3rem;padding:16px 22px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.ghost{box-shadow:none;border-color:transparent;background:transparent;color:var(--ink2);min-height:40px;padding:8px 12px;font-size:1rem}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}

/* cards */
.card{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 6px 0 var(--shadow)}
.card.flat{box-shadow:none}

/* stacked fractions */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;font-family:var(--display);font-weight:600;margin:0 3px}
.fr b{font-weight:600;border-bottom:3px solid currentColor;padding:0 5px 3px}
.fr i{font-style:normal;padding-top:3px}
.mx{display:inline-flex;align-items:center;gap:4px;font-family:var(--display);font-weight:600}
.mx .wh{font-size:1.5em}
.big-fr{font-size:1.5rem}

/* home */
.hero{display:flex;align-items:center;gap:14px}
.hero .face{font-size:3.2rem;line-height:1;filter:drop-shadow(0 4px 0 var(--shadow))}
.shelf{display:flex;flex-wrap:wrap;gap:6px;min-height:44px;align-items:center;background:var(--surface2);border-radius:16px;padding:8px 12px}
.shelf .st{font-size:1.7rem;line-height:1}
.shelf .empty{color:var(--ink2);font-size:.95rem}
.worlds{display:flex;flex-direction:column;gap:12px}
.world{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 5px 0 var(--shadow);transition:transform .08s}
.world:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shadow)}
.world .badge{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-size:2rem;color:#fff}
.world .wname{font-family:var(--display);font-weight:600;font-size:1.25rem}
.world .wblurb{color:var(--ink2);font-size:.92rem}
.world .lv{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.lvpill{font-size:.8rem;font-family:var(--display);background:var(--surface2);border-radius:999px;padding:2px 9px;letter-spacing:.02em}
.lvpill .s{color:var(--lemon);text-shadow:0 1px 0 var(--shadow2)}
.lvpill .o{color:var(--cut)}
.tag{display:inline-block;background:var(--lemon);color:#4A3600;font-family:var(--display);font-size:.75rem;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:middle}

/* level picker */
.levels{display:flex;flex-direction:column;gap:10px}
.lvbtn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:0 5px 0 var(--shadow)}
.lvbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shadow)}
.lvbtn .n{font-family:var(--display);font-weight:600;font-size:1.15rem}
.lvbtn .d{color:var(--ink2);font-size:.9rem}
.stars{font-size:1.2rem;letter-spacing:2px}
.stars .on{color:var(--lemon)}.stars .off{color:var(--cut)}

/* play */
.prog{display:flex;gap:6px;justify-content:center;padding-block:4px}
.prog span{width:28px;height:10px;border-radius:999px;background:var(--line)}
.prog span.ok{background:var(--good)}.prog span.miss{background:var(--peach)}.prog span.cur{background:var(--grape)}
.qcard{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 6px 0 var(--shadow);display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.prompt{font-family:var(--display);font-weight:500;font-size:1.3rem;line-height:1.3}
.prompt .fr{font-size:1.1em}
.visual{width:100%;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px}
.visual svg{max-width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:.95rem}
.legend span::before{content:"";display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px;background:var(--c)}
.part{cursor:pointer;transition:fill .12s}
.part.on{fill:var(--berry)!important}
.sublabel{color:var(--ink2);font-size:.95rem}

/* answer area */
.answer{display:flex;flex-direction:column;gap:12px;align-items:center}
.slots{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:1.8rem}
.slot{min-width:64px;height:60px;border-radius:14px;background:var(--surface2);border:3px solid var(--line);display:grid;place-items:center;font-variant-numeric:tabular-nums;color:var(--ink)}
.slot.active{border-color:var(--grape);box-shadow:0 0 0 4px color-mix(in srgb,var(--grape) 25%,transparent)}
.slot.fixed{background:var(--surface);border-style:dashed;color:var(--ink2)}
.fracbox{display:inline-flex;flex-direction:column;align-items:center;gap:6px}
.fracbox .bar{width:70px;height:4px;background:var(--ink);border-radius:2px}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:340px}
.key{font-family:var(--display);font-weight:600;font-size:1.4rem;height:54px;border-radius:14px;background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--shadow)}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.key.wide{grid-column:span 2}
.key.util{background:var(--surface2);font-size:1.1rem}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.choice{background:var(--surface);border:3px solid var(--line);border-radius:18px;padding:14px 10px;box-shadow:0 4px 0 var(--shadow);font-family:var(--display);font-weight:600;font-size:1.4rem;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:64px}
.choice.sel{border-color:var(--grape);background:color-mix(in srgb,var(--grape) 12%,var(--surface))}
.choice svg{width:120px;height:auto}
.choice .ord{position:absolute;top:-10px;left:-10px;width:30px;height:30px;border-radius:50%;background:var(--grape);color:#fff;display:grid;place-items:center;font-size:1rem}
.choice{position:relative}
.pickrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.pickrow .choice{min-height:120px}
.vs{text-align:center;font-family:var(--display);color:var(--ink2);grid-column:1/-1;margin:-4px 0}

/* feedback */
.feedback{border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;animation:pop .25s ease-out}
.feedback.good{background:var(--good-bg);border:2px solid var(--good)}
.feedback.bad{background:var(--bad-bg);border:2px solid var(--bad)}
.feedback.hint{background:var(--hint-bg);border:2px solid var(--lemon)}
.feedback .t{font-family:var(--display);font-weight:600;font-size:1.25rem}
.feedback p{margin:0}
.feedback .fr{font-size:1.05em}
.actions{display:flex;gap:10px}
.actions .btn{flex:1}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.wiggle{animation:wig .4s ease-in-out}
@keyframes wig{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bounce{animation:bnc .5s ease-out}
@keyframes bnc{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}

/* complete */
.done{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.done .bigstars{font-size:3rem;letter-spacing:6px}
.done .bigstars .on{color:var(--lemon);text-shadow:0 3px 0 var(--shadow2)}
.done .bigstars .off{color:var(--cut)}
.coinpop{font-family:var(--display);font-size:1.5rem;font-weight:600}

/* shop */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.item{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 6px;box-shadow:0 4px 0 var(--shadow)}
.item .em{font-size:2.2rem;line-height:1}
.item .nm{font-family:var(--display);font-size:.9rem}
.item .cost{font-size:.85rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.item.owned{border-color:var(--mint);background:color-mix(in srgb,var(--mint) 12%,var(--surface))}
.item.locked .em{filter:grayscale(1);opacity:.45}
.item[disabled]{opacity:.6}

/* grown-ups */
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-family:var(--display);font-weight:600;color:var(--ink2);font-size:.85rem;text-transform:uppercase;letter-spacing:.04em}
td.num,th.num{text-align:right}
.meter{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--mint);border-radius:999px}
.meter i.low{background:var(--bad)}.meter i.mid{background:var(--lemon)}
.tips{display:flex;flex-direction:column;gap:10px}
.tip{background:var(--surface2);border-radius:14px;padding:10px 12px;font-size:.95rem}
.tip b{font-family:var(--display)}
input.txt{font:inherit;font-family:var(--display);font-size:1.3rem;padding:12px 16px;border-radius:16px;border:3px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.center{text-align:center}
.vstack{display:flex;flex-direction:column;gap:12px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
.tray{display:grid;gap:6px;justify-content:center}
.tray .r{display:flex;gap:6px;padding:4px 6px;border-radius:12px;border:3px solid transparent}
.tray .r.hl{border-color:var(--berry);background:color-mix(in srgb,var(--berry) 12%,transparent)}
.tray .c{font-size:1.5rem;line-height:1}
.ribbon{font-family:var(--display);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.streakbox{display:flex;gap:10px;align-items:center;background:var(--surface2);border-radius:16px;padding:10px 14px}
.streakbox .f{font-size:1.8rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.prompt{font-size:1.15rem}.slots{font-size:1.5rem}.slot{min-width:54px;height:52px}}
</style>

<div id="app">
  <header class="top">
    <div class="brand"><span class="mascot" id="mascot">🐰</span><span id="brandName">Fraction Bakery</span></div>
    <div class="pills"><span class="pill" title="Coins">🪙 <span id="coinCount">0</span></span><span class="pill" title="Day streak">🔥 <span id="streakCount">0</span></span></div>
  </header>
  <main id="screen" class="vstack"></main>
</div>
<canvas id="confetti"></canvas>

<script>
/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const gcd = (a,b) => b ? gcd(b, a%b) : a;
const ri = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const simp = (n,d) => { const k=gcd(n,d)||1; return [n/k, d/k]; };
const F = (n,d) => `<span class="fr"><b>${n}</b><i>${d}</i></span>`;
const M = (w,n,d) => w ? `<span class="mx"><span class="wh">${w}</span>${F(n,d)}</span>` : F(n,d);
const KIDS = ['Mia','Ava','Zoe','Lily','Ruby','Nora','Ellie','Harper','Sadie','Ivy'];
const kid = () => (S.name && Math.random()<.3) ? S.name : pick(KIDS);
const CHEERS = ['Yum! Nailed it!','Sweet!','You got it!','Perfect slice!','Fantastic!','Whoa, baker skills!','That is exactly right!','Sprinkles for you!'];
const NUDGES = ['Not yet. Have a look at this:','Almost! Here is a clue:','Hmm, try once more. A hint:','Close! Think about this:'];

/* ---------- state ---------- */
const KEY = 'fractionBakery.v1';
const DEFAULT = { name:'', coins:0, stars:{}, stats:{}, stickers:[], streak:0, lastDay:'', sound:true, missed:[], played:0 };
let S = load();
function load(){ try{ const raw = localStorage.getItem(KEY); if(raw) return Object.assign({}, DEFAULT, JSON.parse(raw)); }catch(e){} return Object.assign({}, DEFAULT); }
function save(){ S.savedAt=Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} refreshPills(); queueSync(); }

/* ---------- home base: a Google Sheet behind an Apps Script web app (no sign-in needed to play) ---------- */
const REPORT_URL = ''; // paste the deployed Apps Script web app URL here, or set it in the Grown-up corner
function reportUrl(){ try{ return localStorage.getItem('fractionBakery.reportUrl') || REPORT_URL; }catch(e){ return REPORT_URL; } }
async function postHome(payload){ const u=reportUrl(); if(!u) return false;
  try{ const r=await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}); return r.ok; }catch(e){ return false; } }
async function getHome(params){ const u=reportUrl(); if(!u) return null;
  try{ const r=await fetch(u+(u.includes('?')?'&':'?')+new URLSearchParams(params).toString(),{cache:'no-store'}); if(!r.ok) return null; return await r.json(); }catch(e){ return null; } }
let syncTimer=null;
function queueSync(){ if(!reportUrl()||!S.name) return; clearTimeout(syncTimer); syncTimer=setTimeout(()=>postHome({type:'progress', name:S.name, savedAt:S.savedAt, state:S}), 2500); }
async function pullProgress(){ if(!reportUrl()||!S.name) return false;
  const j=await getHome({action:'progress', name:S.name}); if(!j||!j.state) return false;
  if((j.state.savedAt||0) > (S.savedAt||0)){ S=Object.assign({}, DEFAULT, j.state); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} refreshPills(); return true; } return false; }
function refreshPills(){ $('#coinCount').textContent = S.coins; $('#streakCount').textContent = S.streak; }
function today(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function touchStreak(){
  const t = today(); if (S.lastDay === t) return;
  const y = new Date(); y.setDate(y.getDate()-1); const yd = y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
  S.streak = (S.lastDay === yd) ? S.streak+1 : 1; S.lastDay = t; save();
}

/* ---------- shared database (parent reports) ---------- */
let DB = null, DBREADY = false;
(async()=>{ try{ DB = window.claude && window.claude.use ? await window.claude.use('db') : null; }catch(e){ DB=null; } DBREADY=true; })();
async function logSession(rec){ if(!DB) return false; try{ await DB.collection('sessions').add(rec); return true; }catch(e){ return false; } }

/* ---------- sound ---------- */
let AC = null;
function tone(f, t=0.12, type='sine', when=0, vol=.18){
  if(!S.sound) return;
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.value=f; g.gain.value=vol; o.connect(g); g.connect(AC.destination);
    const s=AC.currentTime+when; o.start(s); g.gain.setValueAtTime(vol,s); g.gain.exponentialRampToValueAtTime(0.001,s+t); o.stop(s+t+.02);
  }catch(e){}
}
const sfx = {
  tap(){ tone(520,.06,'triangle',0,.08); },
  good(){ tone(660,.12,'triangle'); tone(880,.16,'triangle',.11); },
  bad(){ tone(220,.18,'sine',0,.12); },
  win(){ [523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',i*.12)); },
  coin(){ tone(1200,.08,'square',0,.06); tone(1600,.1,'square',.07,.06); }
};

/* ---------- confetti ---------- */
const cv = $('#confetti'), cx = cv.getContext('2d'); let parts=[], raf=null;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
function sizeCanvas(){ cv.width = innerWidth*devicePixelRatio; cv.height = innerHeight*devicePixelRatio; cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
addEventListener('resize', sizeCanvas); sizeCanvas();
function burst(n=60, y=innerHeight*.45){
  if(reduced) return;
  const cols=['#FF5C9D','#7B61FF','#2FCB9A','#FFD24D','#4CC3F0','#FF9F6E'];
  for(let i=0;i<n;i++) parts.push({x:innerWidth/2+ri(-40,40), y, vx:ri(-9,9), vy:ri(-14,-4), g:.35, r:ri(4,8), c:pick(cols), a:1, rot:Math.random()*6, vr:(Math.random()-.5)*.3});
  if(!raf) raf=requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p=>{ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.vx*=.99; p.a-=.012; p.rot+=p.vr;
    cx.save(); cx.globalAlpha=Math.max(0,p.a); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.fillStyle=p.c; cx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.4); cx.restore(); });
  parts = parts.filter(p=>p.a>0 && p.y<innerHeight+20);
  raf = parts.length ? requestAnimationFrame(tick) : (cx.clearRect(0,0,innerWidth,innerHeight), null);
}

/* ---------- visuals (SVG) ---------- */
const PINK='var(--berry)', PURPLE='var(--grape)', EMPTY='var(--surface2)', CUT='var(--cut)';
function pie(n, k, k2=0, o={}){
  const size=o.size||140, c=size/2, r=c-4; let s='';
  for(let i=0;i<n;i++){
    const a0=-Math.PI/2+i*2*Math.PI/n, a1=-Math.PI/2+(i+1)*2*Math.PI/n;
    const x0=c+r*Math.cos(a0), y0=c+r*Math.sin(a0), x1=c+r*Math.cos(a1), y1=c+r*Math.sin(a1);
    const fill = i<k ? PINK : (i<k+k2 ? PURPLE : EMPTY);
    const d = n===1 ? `M ${c} ${c} m -${r} 0 a ${r} ${r} 0 1 0 ${2*r} 0 a ${r} ${r} 0 1 0 -${2*r} 0` : `M ${c} ${c} L ${x0} ${y0} A ${r} ${r} 0 ${(2*Math.PI/n>Math.PI)?1:0} 1 ${x1} ${y1} Z`;
    s += `<path class="${o.interactive?'part':''}" data-i="${i}" d="${d}" fill="${fill}" stroke="${CUT}" stroke-width="3" stroke-linejoin="round"/>`;
  }
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="cake cut into ${n} pieces, ${k} shaded">${s}</svg>`;
}
function bar(n, k, k2=0, o={}){
  const W=o.width||300, H=o.height||46, w=W/n; let s='';
  for(let i=0;i<n;i++){ const fill = i<k ? PINK : (i<k+k2 ? PURPLE : EMPTY);
    s += `<rect class="${o.interactive?'part':''}" data-i="${i}" x="${(i*w)+2}" y="2" width="${w-4>0?w-4:w}" height="${H-4}" rx="7" fill="${fill}" stroke="${CUT}" stroke-width="3"/>`; }
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="width:100%;max-width:${W}px" role="img" aria-label="bar cut into ${n} pieces, ${k} shaded">${s}</svg>`;
}
function cakes(whole, n, k, size=92){
  let s=''; for(let i=0;i<whole;i++) s+=pie(n,n,0,{size}); if(k>0) s+=pie(n,k,0,{size}); return s;
}
function tray(total, groups, hl=0){
  const cols = total/groups; let s='';
  for(let g=0; g<groups; g++){ s+=`<div class="r ${g<hl?'hl':''}">`; for(let c=0;c<cols;c++) s+=`<span class="c">🍪</span>`; s+='</div>'; }
  return `<div class="tray">${s}</div>`;
}
const legend = items => `<div class="legend">${items.map(([c,t])=>`<span style="--c:${c}">${t}</span>`).join('')}</div>`;

    return { prompt:`${A} ate ${F(a,n)} of a ${food}. ${B} ate ${F(b,n)} of the same ${food}. How much did they eat <b>together</b>?`,
      visual: bar(n,a,b)+legend([[PINK,`${A} ${F(a,n)}`],[PURPLE,`${B} ${F(b,n)}`]]), input:{type:'frac'}, answer:{type:'frac', n:a+b, d:n, mode:'equiv'},
      hint:`"Together" means <b>add</b>. The pieces are the same size, so add the tops: ${a} + ${b}.`,
      explain:`${a} pieces + ${b} pieces = <b>${a+b}</b> pieces of ${n}. They ate ${F(a+b,n)} of the ${food}.` };

function qStory2(ease){
  const g=ease?pick([2,3,4]):pick([3,4,5,6]); const s=ease?ri(2,5):ri(3,8); const T=g*s; const kk=ri(1,g-1); const A=kid();

function qStory3(ease){
  const A=kid();
  if(Math.random()<.5){ const b=ease?2:pick([2,3,4]); const m=2; const D=b*m; const a=1; const c=ri(1,D-a*m-1>=1?D-a*m-1:1); const used=a*m+c; const left=D-used;

      explain:`${F(a,b)} = ${F(a*m,D)}. Used: ${F(a*m,D)} + ${F(c,D)} = ${F(used,D)}. Left: ${F(D,D)} − ${F(used,D)} = ${F(left,D)}${simp(left,D)[1]!==D?` = ${F(...simp(left,D))}`:''}.` };

function fracInput(cfg, host, single){
  const st={ w:'', n:'', d: cfg.den?String(cfg.den):'', active: single?'n':'n' };
  function render(){
    const slots = single ? `<div class="slot ${st.active==='n'?'active':''}" data-s="n">${st.n||'&nbsp;'}</div>`
      : `${cfg.whole?`<div class="slot ${st.active==='w'?'active':''}" data-s="w">${st.w||'&nbsp;'}</div>`:''}
         <div class="fracbox"><div class="slot ${st.active==='n'?'active':''}" data-s="n">${st.n||'&nbsp;'}</div><div class="bar"></div>
         <div class="slot ${cfg.den?'fixed':''} ${st.active==='d'?'active':''}" data-s="d">${st.d||'&nbsp;'}</div></div>`;
    host.innerHTML = `<div class="slots">${slots}</div>
      <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(k=>`<button class="key" data-k="${k}">${k}</button>`).join('')}<button class="key" data-k="0">0</button>
      <button class="key util" data-k="del">⌫</button>${single?'':`<button class="key util wide" data-k="next">next ▸</button>`}</div>`;
    $$('.slot', host).forEach(s=>{ if(s.classList.contains('fixed')) return; s.onclick=()=>{ st.active=s.dataset.s; render(); }; });
    $$('.key', host).forEach(b=>b.onclick=()=>{ sfx.tap(); const k=b.dataset.k;
      if(k==='del'){ st[st.active]=st[st.active].slice(0,-1); }
      else if(k==='next'){ st.active = nextSlot(); }
      else { if(st[st.active].length<2) st[st.active]+=k; if(st[st.active].length===2 && !single) st.active = nextSlot(); }
      render(); updateCheck(); });
  }
  function nextSlot(){ const order=[cfg.whole?'w':null,'n',cfg.den?null:'d'].filter(Boolean); const i=order.indexOf(st.active); return order[(i+1)%order.length]; }
  render();
  return { read(){ return { w: parseInt(st.w||'0',10), n: parseInt(st.n||'',10), d: parseInt(st.d||'',10), hasWhole: st.w!=='' }; },
    ready(){ return single ? st.n!=='' : (st.n!=='' && st.d!=='' && parseInt(st.d,10)>0); } };

function mcInput(cfg, host){

function orderInput(cfg, host){

    host.innerHTML = `<div class="choices" style="grid-template-columns:1fr">${cfg.items.map((c,i)=>{ const p=seq.indexOf(i); return `<button class="choice ${p>=0?'sel':''}" data-i="${i}">${p>=0?`<span class="ord">${p+1}</span>`:''}${c}</button>`; }).join('')}</div>

    $$('.choice', host).forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; if(seq.includes(i)) return; sfx.tap(); seq.push(i); render(); updateCheck(); });
    $('#orderReset', host).onclick=()=>{ seq=[]; render(); updateCheck(); };

function checkAnswer(q, v){
  const a=q.answer;
  if(a.type==='count') return v===a.k;
  if(a.type==='index') return v===a.i;
  if(a.type==='side') return v===a.s;
  if(a.type==='order') return JSON.stringify(v)===JSON.stringify(a.o);
  if(a.type==='num') return v.n===a.v;
  if(a.type==='frac'){
    if(!(v.d>0) || isNaN(v.n)) return false;
    const val = v.n + (v.hasWhole? v.w:0)*v.d;             // user's value as (val / v.d)
    if(a.mode==='exact') return v.n===a.n && v.d===a.d && !(v.hasWhole && v.w>0);
    if(a.mode==='mixed'){ return val*a.d===a.n*v.d && v.n<v.d && v.hasWhole && v.w===a.w; }
    return val*a.d===a.n*v.d;                               // equivalent value accepted
  }
  return false;
}

function finishQ(firstTry){

  st.q++; if(firstTry) st.first++; if(c.hint) st.hints++; if(c.shown) st.shown++;
  if(c.hint) session.hints++;
  if(c.shown){ session.shown++; const txt=q.prompt.replace(/<b>([^<]*)<\/b><i>([^<]*)<\/i>/g,'$1/$2').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim(); session.missed.push(txt); S.missed.unshift({w:WORLDS[wi].name, p:txt, t:Date.now()}); S.missed=S.missed.slice(0,12); }
  session.results.push(firstTry);
  session.wrongStreak = firstTry ? 0 : session.wrongStreak+1;
  if(session.wrongStreak>=2){ const gen=WORLDS[wi].levels[session.li].gen; for(let i=session.qi+1;i<session.qs.length;i++) session.qs[i]=gen(true); session.wrongStreak=0; }
  session.cur={attempts:0, hint:false, shown:false}; session.qi++; save();
  if(session.qi>=session.qs.length) renderDone(); else renderPlay();
}
function renderDone(){
  const first=session.results.filter(Boolean).length; const stars = first>=5?3:(first>=3?2:1); const key=`${session.wi}.${session.li}`;
  const prev=S.stars[key]||0; S.stars[key]=Math.max(prev,stars); S.coins+=session.coins; S.played++; touchStreak(); save(); sfx.win(); burst(120, innerHeight*.3);
  const w=WORLDS[session.wi]; const li=session.li; const wi=session.wi;
  const rec={ name:S.name, station:w.name, level:w.levels[li].name, stars, first, total:QS_PER_LEVEL, coins:session.coins, hints:session.hints, shown:session.shown, missed:session.missed.slice(0,6),
    minutes: Math.max(1, Math.round((Date.now()-session.started)/60000)), ts: Date.now(), day: today(), streak:S.streak };
  logSession(rec); postHome(Object.assign({type:'session'}, rec));
  const nextLi = li<2 ? li+1 : null; const nextWi = li===2 && wi<WORLDS.length-1 ? wi+1 : null;
  const msg = stars===3 ? 'Perfect batch! Sprinkles is so proud.' : stars===2 ? 'Great baking! One more go for 3 stars?' : 'You finished it! Every try makes you stronger.';
  go(`<section class="card done"><div style="font-size:3rem">🐰🎉</div><h2>${w.name} · ${w.levels[li].name} done!</h2>
    <div class="bigstars">${'<span class="on">★</span>'.repeat(stars)}${'<span class="off">★</span>'.repeat(3-stars)}</div>
    <p style="margin:0">${msg}</p><div class="coinpop">+${session.coins} 🪙</div><p class="muted small" style="margin:0">${first} of ${QS_PER_LEVEL} right on the first try</p>
    <div class="row" style="width:100%">
      ${nextLi!==null?`<button class="btn primary" id="nextLv">Next: ${w.levels[nextLi].name} ▶</button>`:(nextWi!==null?`<button class="btn primary" id="nextW">Next station: ${WORLDS[nextWi].name} ▶</button>`:'')}
      <button class="btn" id="again">↺ Play again</button></div>
    <div class="row" style="width:100%"><button class="btn mint" id="shop2">🎀 Sticker shop</button><button class="btn" id="home2">🏠 Home</button></div></section>`);
  const nl=$('#nextLv'); if(nl) nl.onclick=()=>startLevel(wi,nextLi);
  const nw=$('#nextW'); if(nw) nw.onclick=()=>renderLevels(nextWi);
  $('#again').onclick=()=>startLevel(wi,li); $('#shop2').onclick=renderShop; $('#home2').onclick=renderHome;
  session=null;
}
function renderShop(){
  go(`<button class="btn ghost" id="back" style="align-self:flex-start">◀ Back</button>
    <section class="hero"><span class="face">🎀</span><div><h2>Sticker shop</h2><p class="muted" style="margin:2px 0 0">You have <b>${S.coins}</b> 🪙. Stickers go on your shelf.</p></div></section>
    <div class="shop">${STICKERS.map((s,i)=>{ const own=S.stickers.includes(i); const can=S.coins>=s[2]; return `<button class="item ${own?'owned':(can?'':'locked')}" data-i="${i}" ${own?'disabled':''}><span class="em">${s[0]}</span><span class="nm">${s[1]}</span><span class="cost">${own?'✓ yours':s[2]+' 🪙'}</span></button>`; }).join('')}</div>`);
  $('#back').onclick=renderHome;
  $$('.item').forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; const s=STICKERS[i]; if(S.stickers.includes(i)) return;
    if(S.coins<s[2]){ sfx.bad(); b.classList.add('wiggle'); setTimeout(()=>b.classList.remove('wiggle'),400); return; }
    S.coins-=s[2]; S.stickers.push(i); save(); sfx.coin(); burst(50); renderShop(); });
}
function renderHow(){
  go(`<button class="btn ghost" id="back" style="align-self:flex-start">◀ Back</button>
    <section class="card vstack"><h2>How to play</h2>
    <p style="margin:0">🍰 Each <b>station</b> has three levels: Warm-up, Baker, and Boss. Each level is ${QS_PER_LEVEL} questions.</p>
    <p style="margin:0">⭐ Get 5 or 6 right on the first try for <b>3 stars</b>.</p>
    <p style="margin:0">🪙 Right first time = 10 coins. With a hint = 5. Second try = 3. No timer, ever. Take your time!</p>
    <p style="margin:0">💡 Stuck? Tap <b>Hint</b>. Still stuck? Tap <b>Show me</b> and Sprinkles will explain it, then you move on.</p>
    <p style="margin:0">🎀 Spend coins in the <b>Sticker shop</b>. Stickers live on your shelf at the top of the home screen.</p>
    <p style="margin:0">🔥 Play one level a day to keep your streak!</p></section>`);
  $('#back').onclick=renderHome;
}
function renderGate(){
  const a=ri(6,9), b=ri(6,9);
  go(`<button class="btn ghost" id="back" style="align-self:flex-start">◀ Back</button>
    <section class="card vstack center"><h2>Grown-ups only</h2><p style="margin:0">What is ${a} × ${b}?</p>
    <input class="txt" id="gateIn" inputmode="numeric" placeholder="Answer" autocomplete="off"><button class="btn primary" id="gateGo">Open</button></section>`);
  $('#back').onclick=renderHome;
  const inp=$('#gateIn'); inp.focus();
  const tryIt=()=>{ if(parseInt(inp.value,10)===a*b) renderGrownups(); else { inp.value=''; inp.classList.add('wiggle'); setTimeout(()=>inp.classList.remove('wiggle'),400); } };
  $('#gateGo').onclick=tryIt; inp.onkeydown=e=>{ if(e.key==='Enter') tryIt(); };
}
function renderGrownups(){
  const rows = WORLDS.map((w,i)=>{ const st=S.stats[i]||{q:0,first:0,hints:0,shown:0}; const acc = st.q? Math.round(100*st.first/st.q) : null; return {w,i,st,acc}; });
  const weak = rows.filter(r=>r.st.q>=4).sort((a,b)=>a.acc-b.acc).slice(0,2);
  const untried = rows.filter(r=>r.st.q===0);
  go(`<button class="btn ghost" id="back" style="align-self:flex-start">◀ Back</button>
    <section class="card vstack"><h2>Grown-up corner</h2>
    <p class="muted small" style="margin:0">Levels played: ${S.played} · Coins earned so far: ${S.coins + S.stickers.reduce((t,i)=>t+STICKERS[i][2],0)} · Streak: ${S.streak} day${S.streak===1?'':'s'}</p>
    <div class="tip" id="homeBaseTip">${reportUrl()?`<b>Home base: set.</b> Finished levels go to your Google Sheet and progress follows her name across devices.`:(DB?`<b>Home base: Claude database.</b> Finished levels are recorded while she plays signed in to Claude.`:`<b>Home base: not set on this device.</b> Paste the web app link below so results reach your Google Sheet.`)}</div>
    <div class="vstack"><input class="txt" id="reportUrlIn" placeholder="Home base link (Apps Script web app URL)" value="${esc(reportUrl())}" autocomplete="off">
    <div class="row"><button class="btn" id="reportSave">Save link</button><button class="btn" id="reportTest">Test connection</button></div><div id="reportMsg" class="small muted"></div></div>
    <h3>First-try accuracy by station</h3>
    <table><thead><tr><th>Station</th><th class="num">Qs</th><th class="num">First try</th><th class="num">Shown</th><th style="width:30%">&nbsp;</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${r.w.emoji} ${r.w.name}</td><td class="num">${r.st.q}</td><td class="num">${r.acc===null?'–':r.acc+'%'}</td><td class="num">${r.st.shown}</td><td><div class="meter"><i class="${r.acc===null?'':(r.acc<50?'low':(r.acc<75?'mid':''))}" style="width:${r.acc||0}%"></i></div></td></tr>`).join('')}
    </tbody></table>
    <p class="small muted" style="margin:0">"Shown" counts questions where she needed the full worked answer. Those are the ones to sit down with.</p>
    ${weak.length?`<h3>Where to help this week</h3><div class="tips">${weak.map(r=>`<div class="tip"><b>${r.w.emoji} ${r.w.name} (${r.acc}% first try)</b><br>${r.w.tip}</div>`).join('')}</div>`:`<div class="tip">Once she has played a few levels, this spot will show the two stations she finds hardest and how to explain them the Singapore Math way.</div>`}
    ${untried.length&&untried.length<WORLDS.length?`<p class="small muted" style="margin:0">Not tried yet: ${untried.map(r=>r.w.name).join(', ')}.</p>`:''}
    ${S.missed.length?`<h3>Recent questions she needed shown</h3><ul style="margin:0;padding-left:18px;font-size:.92rem">${S.missed.slice(0,8).map(m=>`<li><b>${m.w}:</b> ${esc(m.p)}</li>`).join('')}</ul>`:''}
    <h3>How the stations map to her book</h3>
    <p class="small" style="margin:0">Math in Focus 4A, Chapter 6 "Fractions and Mixed Numbers": <b>Add Em Up</b> and <b>Take Away</b> are lessons 6.1 and 6.2 (like and related denominators). <b>Whole Cakes</b> covers 6.3 to 6.5 (mixed numbers, improper fractions, renaming). <b>Add Em Up Boss</b> and <b>Take Away Boss</b> cover 6.6 (renaming wholes). <b>Cookie Trays</b> is 6.7 (fraction of a set). <b>Story Time</b> is 6.8. <b>Slice It</b>, <b>Twins</b>, and <b>Bigger Bite</b> are the Grade 3 foundations the chapter assumes. If she struggles in Add Em Up, go back to Twins first: adding related denominators is really equivalent fractions in disguise.</p>
    <h3>Settings</h3>
    <div class="row"><button class="btn" id="renameBtn">Change her name</button><button class="btn" id="resetBtn">Reset all progress</button></div>
    <div id="resetConfirm"></div></section>`);
  $('#back').onclick=renderHome;
  $('#reportSave').onclick=()=>{ const v=$('#reportUrlIn').value.trim(); try{ if(v) localStorage.setItem('fractionBakery.reportUrl', v); else localStorage.removeItem('fractionBakery.reportUrl'); }catch(e){} $('#reportMsg').textContent = v ? 'Saved on this device.' : 'Cleared.'; queueSync(); };
  $('#reportTest').onclick=async()=>{ const v=$('#reportUrlIn').value.trim(); if(!v){ $('#reportMsg').textContent='Paste a link first.'; return; } $('#reportMsg').textContent='Testing…';
    try{ const r=await fetch(v+(v.includes('?')?'&':'?')+'action=ping',{cache:'no-store'}); const j=await r.json(); $('#reportMsg').textContent = j&&j.ok ? `Connected to "${j.sheet||'your sheet'}". Save the link to use it.` : 'That link answered, but not like the Fraction Bakery script.'; }
    catch(e){ $('#reportMsg').textContent='Could not reach that link. Check it was deployed as a web app that anyone can access.'; } };
  $('#renameBtn').onclick=()=>{ S.name=''; save(); renderName(); };
  $('#resetBtn').onclick=()=>{ $('#resetConfirm').innerHTML=`<div class="feedback bad"><div class="t">Erase stars, coins, and stickers?</div><div class="actions"><button class="btn" id="resetNo">Keep them</button><button class="btn primary" id="resetYes">Yes, erase</button></div></div>`;
    $('#resetNo').onclick=()=>$('#resetConfirm').innerHTML=''; $('#resetYes').onclick=()=>{ const name=S.name; S=Object.assign({},DEFAULT,{name}); save(); renderHome(); }; };
}

/* ---------- boot ---------- */
function start(data){
  refreshPills();
  if(data && data.session){ session=data.session; inputCtl=null; renderPlay(); return; }
  if(!S.name) renderName(); else { renderHome(); pullProgress().then(changed=>{ if(changed && !session) renderHome(); }); }
}
try{ window.claude?.hot?.snapshot?.(()=>({session})); }catch(e){}
(window.claude?.hot?.ready) ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body></html>
